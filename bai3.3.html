<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
	<script>
		m=prompt("nhập vào số dòng");
		n=prompt("nhập vào số cột");
		document.write("<table width='50%'border='1' align'center' cellpadding='0' cellspacing='0'>");
		for(i=1;i<m;i++){
			document.write("<tr");
			for(j=1;j<=n;j++){
				document.write("<td align='center'>"+i+j+"</td>");
			}
			document.write("</tr>");
		}
		document.write("</table");
	</script>
</head>
<body>
</body>
</html>
