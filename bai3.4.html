<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
	<script>
		n=prompt("nhập số sinh viên");
		document.write("<table border='3' align='center' width='50%' cellpadding='0' cellspacing='0'>");
		document.write("<tr>");
		document.write("<td colspan='3' align='center' class='bg'><h3>DANH SÁCH SINH VIÊN</h3></td>");
		document.write("</tr>");
		document.write("<tr>");
		document.write("<th>Mã SV </th><th>Họ tên</th><th>Lớp</th>");
		document.write("</tr>");
		for(i=1;i<=n;i++){
			masv = prompt("nhập vào Mã số SV");
			hoten = prompt("nhập họ tên");
			tenlop = prompt("nhập tên lớp");
			document.write("<tr>");
			document.write("<td"+ masv + "</td><td>" + hoten + "</td><td>" + tenlop +"</td>");
			document.write("</tr>");
		}
		document.write("</table>");
	</script>
</head>
<body>

</body>
</html>
